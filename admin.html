<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL 9 | ADMIN DASHBOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }
        
        /* Galaxy Background */
        .galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #020208 100%);
        }
        
        /* Stars Animation */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        /* Nebula Clouds */
        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            pointer-events: none;
            z-index: -1;
            animation: drift 30s infinite ease-in-out;
        }
        
        .nebula-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0,255,255,0.3) 0%, transparent 70%);
            top: 20%;
            left: -10%;
        }
        
        .nebula-2 {
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(138,43,226,0.25) 0%, transparent 70%);
            bottom: -20%;
            right: -10%;
            animation-delay: -15s;
        }
        
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -30px) scale(1.1); }
            66% { transform: translate(-30px, 50px) scale(0.9); }
        }
        
        /* Shooting Stars */
        .shooting-star {
            position: fixed;
            width: 2px;
            height: 2px;
            background: linear-gradient(45deg, white, transparent);
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            animation: shoot 6s linear infinite;
        }
        
        @keyframes shoot {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translateX(-300px) translateY(200px);
                opacity: 0;
            }
        }
        
        /* Custom Cursor */
        .custom-cursor {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
        }
        
        .custom-cursor-follower {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.15s ease;
        }
        
        /* Admin Table Styles */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .admin-table th {
            text-align: left;
            padding: 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-weight: 500;
            letter-spacing: 0.05em;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
        }
        
        .admin-table td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        
        .admin-table tr {
            transition: all 0.3s ease;
        }
        
        .admin-table tr:hover {
            background: rgba(255,255,255,0.03);
        }
        
        /* Form Inputs */
        .admin-input {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px 18px;
            width: 100%;
            color: white;
            outline: none;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .admin-input:focus {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.05);
            transform: translateY(-2px);
        }
        
        /* Buttons */
        .btn-outline {
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            padding: 8px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            letter-spacing: 0.1em;
            position: relative;
            overflow: hidden;
        }
        
        .btn-outline:hover {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.05);
            transform: translateY(-2px);
        }
        
        .btn-outline:active {
            transform: translateY(0);
        }
        
        .btn-cancel {
            background: rgba(255,50,50,0.1);
            border: 1px solid rgba(255,50,50,0.3);
            padding: 6px 16px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }
        
        .btn-cancel:hover {
            background: rgba(255,50,50,0.25);
            border-color: rgba(255,50,50,0.6);
            transform: scale(1.02);
        }
        
        .btn-cancel:active {
            transform: scale(0.98);
        }
        
        /* Status badges */
        .status-confirmed {
            color: rgba(80,200,80,0.7);
            letter-spacing: 0.05em;
            font-size: 11px;
            font-weight: 500;
            position: relative;
            display: inline-block;
        }
        
        .status-confirmed::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: rgba(80,200,80,0.7);
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        
        .status-cancelled {
            color: rgba(255,100,100,0.5);
            letter-spacing: 0.05em;
            font-size: 11px;
            text-decoration: line-through;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        /* Filter buttons */
        .filter-btn {
            border: 1px solid rgba(255,255,255,0.15);
            background: transparent;
            padding: 6px 16px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }
        
        .filter-btn:hover {
            border-color: rgba(255,255,255,0.3);
        }
        
        .filter-btn.active {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.4);
        }
        
        /* Stats cards */
        .stat-card {
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.4s ease;
            cursor: pointer;
        }
        
        .stat-card:hover {
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-4px);
        }
        
        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(26,26,26,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px 24px;
            font-size: 13px;
            z-index: 1000;
            animation: slideInRight 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.02em;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Row animations */
        .row-cancelled {
            opacity: 0.5;
            background: rgba(255,0,0,0.03);
        }
        
        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
        
        /* Login container animation */
        .login-container {
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Galaxy Background -->
    <div class="galaxy-bg"></div>
    
    <!-- Stars Container -->
    <div class="stars" id="stars"></div>
    
    <!-- Nebula Clouds -->
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    
    <!-- Shooting Stars -->
    <div class="shooting-star" style="top: 10%; left: 80%; animation-delay: 0s;"></div>
    <div class="shooting-star" style="top: 50%; left: 90%; animation-delay: 4s;"></div>
    
    <!-- Custom Cursor -->
    <div class="custom-cursor"></div>
    <div class="custom-cursor-follower"></div>

    <div class="max-w-7xl mx-auto px-6 py-10 relative z-10">
        <!-- Header -->
        <div class="flex justify-between items-center mb-12 pb-4 border-b border-white/10" data-aos="fade-down">
            <div class="group cursor-pointer">
                <span class="text-2xl font-bold tracking-tighter">LEVEL 9</span>
                <span class="text-[9px] block text-white/40 tracking-[0.2em] group-hover:text-white/70 transition">ADMIN DASHBOARD</span>
            </div>
            <div class="flex gap-3">
                <button id="refreshBtn" class="btn-outline hidden">
                    ⟳ REFRESH
                </button>
                <button id="logoutBtn" class="btn-outline hidden">
                    LOGOUT
                </button>
            </div>
        </div>

        <!-- Login Screen -->
        <div id="loginScreen" class="max-w-md mx-auto mt-20 login-container">
            <div class="border border-white/10 p-12" data-aos="fade-up">
                <h2 class="text-2xl font-light tracking-tight mb-8">ADMIN ACCESS</h2>
                <input type="password" id="adminPassword" placeholder="ENTER PASSWORD" class="admin-input mb-5" autocomplete="off">
                <button id="loginBtn" class="btn-outline w-full py-3">
                    VERIFY
                </button>
                <div id="loginError" class="mt-4 text-red-500/60 text-xs text-center hidden"></div>
            </div>
        </div>

        <!-- Admin Content -->
        <div id="adminContent" class="hidden">
            <!-- Stats Cards -->
            <div class="grid md:grid-cols-3 gap-6 mb-10">
                <div class="stat-card p-8" data-aos="fade-up" data-aos-delay="0">
                    <div class="text-xs tracking-[0.2em] text-white/40 mb-2">TODAY'S RESERVATIONS</div>
                    <div id="todayCount" class="text-5xl font-light">0</div>
                </div>
                <div class="stat-card p-8" data-aos="fade-up" data-aos-delay="100">
                    <div class="text-xs tracking-[0.2em] text-white/40 mb-2">TOTAL RESOURCES</div>
                    <div class="text-2xl font-light">12 TABLES / 12 PS5</div>
                </div>
                <div class="stat-card p-8" data-aos="fade-up" data-aos-delay="200">
                    <div class="text-xs tracking-[0.2em] text-white/40 mb-2">FILTER</div>
                    <div class="flex gap-2 mt-2">
                        <button id="filterAll" class="filter-btn active">ALL</button>
                        <button id="filterConfirmed" class="filter-btn">CONFIRMED</button>
                        <button id="filterCancelled" class="filter-btn">CANCELLED</button>
                    </div>
                </div>
            </div>

            <!-- Reservations Table -->
            <div class="border border-white/10 overflow-hidden" data-aos="fade-up" data-aos-delay="300">
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-white/5">
                    <span class="text-sm tracking-wide font-light">ALL RESERVATIONS</span>
                    <span id="recordCount" class="text-xs text-white/30"></span>
                </div>
                <div class="overflow-x-auto">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>DATE</th>
                                <th>TIME</th>
                                <th>TYPE</th>
                                <th>GUEST</th>
                                <th>PHONE</th>
                                <th>STATUS</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="reservationsList">
                            <tr>
                                <td colspan="7" class="text-center text-white/30 py-16">
                                    <div class="skeleton h-4 w-32 mx-auto mb-2"></div>
                                    LOADING...
                                <\/td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init({
            duration: 600,
            once: true,
            offset: 50
        });
        
        // Generate Stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.animationDelay = `${Math.random() * 5}s`;
                starsContainer.appendChild(star);
            }
        }
        createStars();
        
        // Custom cursor
        const cursor = document.querySelector('.custom-cursor');
        const cursorFollower = document.querySelector('.custom-cursor-follower');
        
        if (cursor && cursorFollower) {
            document.addEventListener('mousemove', (e) => {
                cursor.style.transform = `translate(${e.clientX - 4}px, ${e.clientY - 4}px)`;
                cursorFollower.style.transform = `translate(${e.clientX - 20}px, ${e.clientY - 20}px)`;
            });
        }
        
        // YOUR SUPABASE CREDENTIALS
        const SUPABASE_URL = 'https://valutzpbnwdxrbgwyeld.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_c0u-6UfiWcB_IE6EYbPOMQ_1vaKRPGv';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentFilter = 'all';
        let allReservations = [];
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.borderLeft = isError ? '3px solid rgba(255,50,50,0.8)' : '3px solid rgba(80,200,80,0.8)';
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
        
        async function getAdminPassword() {
            const { data, error } = await supabaseClient
                .from('settings')
                .select('value')
                .eq('key', 'admin_password')
                .single();
            
            if (error) {
                console.error('Error fetching admin password:', error);
                return 'admin123';
            }
            return data.value;
        }
        
        async function loadReservations() {
            const tbody = document.getElementById('reservationsList');
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-white/30 py-16"><div class="skeleton h-4 w-32 mx-auto mb-2"></div>LOADING...</td></tr>';
            
            const { data, error } = await supabaseClient
                .from('reservations')
                .select(`
                    id,
                    reservation_date,
                    hour_slot,
                    guest_name,
                    guest_phone,
                    status,
                    created_at,
                    resources (
                        name,
                        type
                    )
                `)
                .order('reservation_date', { ascending: false })
                .order('hour_slot', { ascending: true });
            
            if (error) {
                console.error('Error loading reservations:', error);
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-red-500/50 py-16">ERROR LOADING DATA</td></tr>';
                return;
            }
            
            allReservations = data || [];
            filterAndDisplay();
        }
        
        function filterAndDisplay() {
            let filtered = [...allReservations];
            
            if (currentFilter === 'confirmed') {
                filtered = filtered.filter(r => r.status === 'confirmed');
            } else if (currentFilter === 'cancelled') {
                filtered = filtered.filter(r => r.status === 'cancelled');
            }
            
            displayReservations(filtered);
        }
        
        function displayReservations(reservations) {
            const tbody = document.getElementById('reservationsList');
            tbody.innerHTML = '';
            
            let todayCount = 0;
            const today = new Date().toISOString().split('T')[0];
            
            if (!reservations || reservations.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-white/30 py-16">NO RESERVATIONS</td></tr>';
                document.getElementById('todayCount').innerHTML = '0';
                document.getElementById('recordCount').innerHTML = '';
                return;
            }
            
            reservations.forEach((res, index) => {
                if (res.reservation_date === today && res.status === 'confirmed') {
                    todayCount++;
                }
                
                const row = tbody.insertRow();
                row.className = `transition-all duration-300 ${res.status === 'cancelled' ? 'row-cancelled' : ''}`;
                row.style.animation = `fadeInUp 0.4s ease forwards ${index * 0.05}s`;
                row.style.opacity = '0';
                
                row.insertCell(0).innerHTML = res.reservation_date;
                row.insertCell(1).innerHTML = `${res.hour_slot}:00 — ${res.hour_slot + 1}:00`;
                row.insertCell(2).innerHTML = res.resources?.type === 'ps5' ? '🎮 PS5' : '🍽️ TABLE';
                row.insertCell(3).innerHTML = res.guest_name || '—';
                row.insertCell(4).innerHTML = res.guest_phone || '—';
                row.insertCell(5).innerHTML = `<span class="${res.status === 'confirmed' ? 'status-confirmed' : 'status-cancelled'}">${res.status.toUpperCase()}</span>`;
                
                const actionCell = row.insertCell(6);
                if (res.status === 'confirmed') {
                    const cancelBtn = document.createElement('button');
                    cancelBtn.innerHTML = 'CANCEL';
                    cancelBtn.className = 'btn-cancel';
                    cancelBtn.setAttribute('data-id', res.id);
                    cancelBtn.onclick = (function(id) {
                        return function() { cancelReservation(id); };
                    })(res.id);
                    actionCell.appendChild(cancelBtn);
                } else {
                    actionCell.innerHTML = '—';
                }
            });
            
            const confirmedToday = allReservations.filter(r => r.reservation_date === today && r.status === 'confirmed').length;
            document.getElementById('todayCount').innerHTML = confirmedToday;
            document.getElementById('recordCount').innerHTML = `${reservations.length} ${currentFilter !== 'all' ? `(${allReservations.length} total)` : ''}`;
        }
        
        async function cancelReservation(id) {
            const confirmed = confirm('Cancel this reservation? This action cannot be undone.');
            
            if (!confirmed) return;
            
            const buttons = document.querySelectorAll('.btn-cancel');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-id') == id) {
                    btn.innerHTML = '...';
                    btn.disabled = true;
                }
            });
            
            try {
                const { data, error } = await supabaseClient
                    .from('reservations')
                    .update({ status: 'cancelled' })
                    .eq('id', id)
                    .select();
                
                if (error) {
                    showToast('❌ Error: ' + error.message, true);
                } else {
                    showToast('✅ Reservation cancelled successfully');
                    
                    const index = allReservations.findIndex(r => r.id === id);
                    if (index !== -1) {
                        allReservations[index].status = 'cancelled';
                    }
                    
                    filterAndDisplay();
                }
            } catch (err) {
                showToast('❌ Error: ' + err.message, true);
            }
        }
        
        function setFilter(filter) {
            currentFilter = filter;
            
            document.getElementById('filterAll').classList.remove('active');
            document.getElementById('filterConfirmed').classList.remove('active');
            document.getElementById('filterCancelled').classList.remove('active');
            
            if (filter === 'all') document.getElementById('filterAll').classList.add('active');
            if (filter === 'confirmed') document.getElementById('filterConfirmed').classList.add('active');
            if (filter === 'cancelled') document.getElementById('filterCancelled').classList.add('active');
            
            filterAndDisplay();
        }
        
        document.getElementById('refreshBtn').onclick = async () => {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.style.transform = 'rotate(360deg)';
            showToast('⟳ Refreshing...');
            await loadReservations();
            showToast('✅ Refreshed');
            setTimeout(() => {
                refreshBtn.style.transform = 'rotate(0deg)';
            }, 300);
        };
        
        document.getElementById('loginBtn').onclick = async () => {
            const enteredPassword = document.getElementById('adminPassword').value;
            const correctPassword = await getAdminPassword();
            const errorDiv = document.getElementById('loginError');
            
            if (enteredPassword === correctPassword) {
                document.getElementById('loginScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('adminContent').classList.remove('hidden');
                    document.getElementById('logoutBtn').classList.remove('hidden');
                    document.getElementById('refreshBtn').classList.remove('hidden');
                    loadReservations();
                }, 300);
                errorDiv.classList.add('hidden');
                showToast('✅ Logged in as Admin');
            } else {
                errorDiv.innerHTML = 'ACCESS DENIED';
                errorDiv.classList.remove('hidden');
                showToast('❌ Wrong password', true);
            }
        };
        
        document.getElementById('filterAll').onclick = () => setFilter('all');
        document.getElementById('filterConfirmed').onclick = () => setFilter('confirmed');
        document.getElementById('filterCancelled').onclick = () => setFilter('cancelled');
        
        document.getElementById('logoutBtn').onclick = () => {
            document.getElementById('adminContent').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('refreshBtn').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginScreen').style.opacity = '1';
            document.getElementById('adminPassword').value = '';
            showToast('🔒 Logged out');
        };
        
        document.getElementById('adminPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });
        
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
